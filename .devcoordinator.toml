schema = 2

[deployment.debian-qualification]
source = ["worktree"]
components = ["check"]
public = false
ttl_seconds = 86400

[deployment.debian-qualification.component.check]
type = "compose"
files = ["automation/qualification/debian.compose.yaml"]
services = ["probe"]
finite_services = ["probe"]
build = true
timeout_seconds = 900

# User-selected public download-only route: https://kicad.vr.ae.
# Immutable checkout generations keep development builds away from the server.
[deployment.downloads]
source = ["checkout"]
domain = "kicad"
components = ["files"]
public = true
build = ["dotnet", "publish", "automation/tools/KiCad.Automation.Downloads/KiCad.Automation.Downloads.csproj", "--configuration", "Release", "-p:RestoreLockedMode=true", "--output", "automation/artifacts/download-host"]

[deployment.downloads.component.files]
type = "process"
command = ["dotnet", "automation/artifacts/download-host/kicad-downloads.dll"]
port = true
route = true
health = { path = "/healthz", timeout_seconds = 60 }
env = { ASPNETCORE_ENVIRONMENT = "Production", KICAD_DOWNLOAD_ROOT = "/mnt/build-storage/codex/kicad/public-candidates/signed-preview-000008", KICAD_UPDATE_PUBLISHER_SPKI_FILE = "/home/holyglory/kicad/automation/distribution/preview-publisher.spki" }

[test]
default = "automation"

# Authorized by kicad-update-signing-standing-authority on 2026-09-08.
# Already provisioned: re-running refuses to replace either existing key file.
# Explicit one-time publisher provisioning, not verification/readiness proof.
# Private key bytes never appear in command arguments or results.
[test.publisher-provision]
timeout_seconds = 120
env = { TMPDIR = "/mnt/build-storage/codex/kicad/t" }

[[test.publisher-provision.check]]
name = "key"
tier = "development"
command = ["dotnet", "automation/tools/KiCad.Automation.Validation/bin/Debug/net10.0/kicad-validate.dll", "publisher-create", "--private", "/mnt/build-storage/codex/kicad/signing/preview-publisher.pkcs8", "--public", "/home/holyglory/kicad/automation/distribution/preview-publisher.spki"]

