[[test.native-foundation.check]]
name = "native-session"
tier = "development"
requires = ["native-build"]
command = ["dotnet", "test", "automation/KiCad.Automation.slnx", "--no-build", "--no-restore", "--configuration", "Debug", "--filter", "TestCategory=NativeSession&TestCategory!=NativePackage&TestCategory!=NativePackageArchive&TestCategory!=NativeUpdateArchive", "--logger", "trx", "--results-directory", "automation/artifacts/native-session-results"]
retained_artifacts = [{ name = "native-session-evidence", path = "automation/artifacts/native-session-current", max_bytes = 33554432 }]
