name: Native delivery
run-name: Native delivery ${{ inputs.source_commit }} (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit in this fork (no branch names)
        required: true
        type: string
      target:
        description: Native targets to build
        required: true
        default: all
        type: choice
        options: [all, mac, mac-arm64, mac-x64, windows]
      checks_only:
        description: Run only small native delivery fixtures (no KiCad package)
        type: boolean
        default: false
      mac_fixture:
        description: With checks_only, select all Mac checks or a focused native fixture
        type: choice
        default: all
        options: [all, caption, handoff, staging, ui-access]

# SA-09: disposable public-source builds; no publisher key, engineering
# repository, persistent runner or live editor-control endpoint.
permissions:
  contents: read

jobs:
  mac:
    if: inputs.target == 'all' || startsWith(inputs.target, 'mac')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'mac-arm64' && '[{"runner":"macos-15","architecture":"arm64"}]' || inputs.target == 'mac-x64' && '[{"runner":"macos-15-intel","architecture":"x64"}]' || '[{"runner":"macos-15","architecture":"arm64"},{"runner":"macos-15-intel","architecture":"x64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DELIVERY_ARCHITECTURE: ${{ matrix.architecture }}
      MAC_BUILDER_COMMIT: 227de1489ae646b2723723bad99f27c10c07c322
      MAC_FIXTURE: ${{ inputs.mac_fixture }}
      CHECKS_ONLY: ${{ inputs.checks_only }}
      HOMEBREW_NO_ANALYTICS: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check exact source input
        shell: bash
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify pinned ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor f638a860a05b3e48d1074314a656ad9b8f597466 HEAD
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: automation/global.json
      - name: Check native Mac dependency relocation and failure detection
        working-directory: automation
        shell: bash
        run: |
          export KICAD_HOSTED_FIXTURE_EVIDENCE="$RUNNER_TEMP/kicad-loader-preflight/evidence"
          kicad_mac_test_filter='FullyQualifiedName~MacRuntimePathTests|FullyQualifiedName~MacArchivePreflightTests|FullyQualifiedName~MacUpdateStagerTests|FullyQualifiedName~MacVerifiedInstallationTests|FullyQualifiedName~PosixUpdateActivationTests|FullyQualifiedName~MacProcessIdentityTests|FullyQualifiedName~MacUpdateHandoffTests|FullyQualifiedName~MacCaptionActionTests'
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = caption ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacCaptionActionTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = handoff ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacProcessIdentityTests|FullyQualifiedName~MacUpdateHandoffTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = staging ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacUpdateStagerTests|FullyQualifiedName~NngBindingLifetimeTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = ui-access ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacUiDriverTests'
          fi
          dotnet test KiCad.Automation.slnx --configuration Release \
            --filter "$kicad_mac_test_filter" --logger trx \
            --results-directory "$RUNNER_TEMP/kicad-loader-preflight"
      - name: Prepare official Mac dependencies and validate the candidate
        if: '!inputs.checks_only'
        working-directory: automation
        shell: bash
        run: |
          dotnet run --project tools/KiCad.Automation.Validation --configuration Release -- \
            hosted --repository "$GITHUB_WORKSPACE" --commit "$SOURCE_COMMIT" \
            --architecture "$DELIVERY_ARCHITECTURE" --output "$RUNNER_TEMP/kicad-delivery" \
            --dependency-commit "$MAC_BUILDER_COMMIT"
      - name: Retain native result and bounded build evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos-${{ matrix.architecture }}-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kicad-delivery/evidence
            ${{ runner.temp }}/kicad-loader-preflight
            ${{ runner.temp }}/kicad-delivery/receipt.json
            ${{ runner.temp }}/kicad-delivery/packages
            ${{ runner.temp }}/kicad-delivery/diagnostics
            ${{ runner.temp }}/kicad-delivery/mac/evidence
            ${{ runner.temp }}/kicad-delivery/mac/result.json
            ${{ runner.temp }}/kicad-delivery/mac/evidence.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      VCPKG_COMMIT: 66c0373dc7fca549e5803087b9487edfe3aca0a1
      # KiCad's documented, public read-only binary feed. ABI misses still build
      # from the pinned manifest/registries; no packages are pushed to GitLab.
      VCPKG_BINARY_SOURCES: clear;default,readwrite;nuget,https://gitlab.com/api/v4/projects/27426693/packages/nuget/index.json,read
      CHECKS_ONLY: ${{ inputs.checks_only }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check exact source input
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'An exact lower-case commit is required.' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify pinned ancestry and select installed MSVC
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { throw 'Wrong source commit.' }
          git merge-base --is-ancestor f638a860a05b3e48d1074314a656ad9b8f597466 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ancestry is missing.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'The runner is missing MSVC x64.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsRedistDir', 'VSINSTALLDIR')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: automation/global.json
      - name: Check Windows delivery contracts and select supported stages
        id: stages
        working-directory: automation
        shell: pwsh
        run: |
          $env:KICAD_HOSTED_FIXTURE_EVIDENCE = "$env:RUNNER_TEMP/kicad-windows-preflight/evidence"
          dotnet test KiCad.Automation.slnx --configuration Release `
            --filter 'FullyQualifiedName~HostedDeliveryTests|FullyQualifiedName~HostedWindowsCheckpointTests|FullyQualifiedName~WindowsJsonLinkTests|FullyQualifiedName~NativeIpcEndpointTests' `
            --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
          if ($LASTEXITCODE -ne 0) { throw 'Windows delivery preflight failed.' }
          $split = Test-Path 'tools/KiCad.Automation.Validation/HostedWindowsCheckpoint.cs'
          "split=$($split.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Prepare Windows dependencies and native build configuration
        if: steps.stages.outputs.split == 'true' && !inputs.checks_only
        id: prepare
        working-directory: automation
        shell: pwsh
        run: |
          dotnet run --project tools/KiCad.Automation.Validation --configuration Release -- `
            hosted --repository "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" `
            --architecture x64 --output "$env:RUNNER_TEMP/kicad-delivery" `
            --dependency-commit "$env:VCPKG_COMMIT" --phase prepare
          if ($LASTEXITCODE -ne 0) { throw 'Windows preparation failed; see retained evidence.' }
      - name: Retain preparation evidence before native compilation
        if: always() && steps.stages.outputs.split == 'true' && !inputs.checks_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preparation-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kicad-delivery/evidence
            ${{ runner.temp }}/kicad-delivery/windows-prepared.json
            ${{ runner.temp }}/kicad-delivery/receipt.json
            ${{ runner.temp }}/kicad-windows-preflight
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Build, inspect and package Windows x64
        if: success() && !inputs.checks_only
        working-directory: automation
        shell: pwsh
        run: |
          # Older exact source commits retain their original all-in-one command.
          $phaseArguments = @()
          if ('${{ steps.stages.outputs.split }}' -eq 'true') { $phaseArguments = @('--phase', 'build') }
          dotnet run --project tools/KiCad.Automation.Validation --configuration Release -- `
            hosted --repository "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" `
            --architecture x64 --output "$env:RUNNER_TEMP/kicad-delivery" `
            --dependency-commit "$env:VCPKG_COMMIT" @phaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows delivery failed; see retained evidence.' }
      - name: Retain native result and bounded build evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-x64-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kicad-delivery/evidence
            ${{ runner.temp }}/kicad-delivery/receipt.json
            ${{ runner.temp }}/kicad-delivery/packages
            ${{ runner.temp }}/kicad-delivery/windows-prepared.json
            ${{ runner.temp }}/kicad-delivery/windows-build-started.json
            ${{ runner.temp }}/kicad-windows-preflight
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
