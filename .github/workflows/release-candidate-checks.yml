name: KAICad release workflow checks
run-name: Release workflow checks ${{ inputs.source_commit || github.sha }}
on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit to check; blank uses the selected branch
        type: string
        default: ''
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Require an exact commit for manual source selection
        shell: bash
        run: '[[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: automation/global.json
      - name: Test detection, integration, provenance and failure recovery
        run: >-
          dotnet test automation/KiCad.Automation.slnx --configuration Release
          --filter 'TestCategory=UpstreamRelease|FullyQualifiedName~HostedWindowsCheckpointTests|FullyQualifiedName~HostedDeliveryTests|FullyQualifiedName~HostedPreviewStagingTests'
          --logger trx --results-directory '${{ runner.temp }}/release-workflow-checks'
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-workflow-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-workflow-checks
          if-no-files-found: warn
          retention-days: 30
